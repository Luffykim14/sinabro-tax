<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · 시나브로 세금계산서</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8edf3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            width: 360px;
        }
        .logo {
            text-align: center;
            font-weight: 800;
            font-size: 14px;
            color: #16a34a;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 22px;
            color: #111;
            text-align: center;
        }
        .subtitle {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 28px;
            text-align: center;
        }
        label {
            display: block;
            font-size: 13px;
            color: #374151;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 16px;
            transition: border-color 0.15s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #16a34a;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #15803d; }
        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            border: 1px solid #fecaca;
        }
        .footer {
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">SINABRO AD</div>
        <h1>세금계산서 자동 입력</h1>
        <div class="subtitle">접근하려면 비밀번호를 입력하세요</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" autocomplete="off">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autofocus required>
            <button type="submit">로그인</button>
        </form>
        <div class="footer">© 시나브로마케팅</div>
    </div>
</body>
</html>
